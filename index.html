<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story ❤️</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffc2d1 100%);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .heading {
            font-family: 'Dancing Script', cursive;
            color: #ff4d6d;
            font-size: 3.5rem;
            text-align: center;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .subheading {
            text-align: center;
            color: #c9184a;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .gallery-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }
        
        .photo-card {
            background: white;
            border: 8px solid #fff;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 4px;
            overflow: hidden;
            width: 280px;
        }
        
        .photo-card img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        .footer {
            text-align: center;
            padding: 40px;
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #ff4d6d;
        }
    </style>
</head>
<body>

    <h1 class="heading animate__animated animate__fadeInDown">Our Beautiful Journey</h1>
    <p class="subheading animate__animated animate__fadeInUp">Every moment with you is a favorite memory ❤️</p>

    <div class="gallery-container">
        <div class="photo-grid">
            
            <!-- Photo 1 -->
            <div class="photo-card animate__animated animate__zoomIn">
                <img src="pic1.jpeg" alt="Memory 1">
            </div>

            <!-- Photo 2 -->
            <div class="photo-card animate__animated animate__zoomIn">
                <img src="pic2.jpeg" alt="Memory 2">
            </div>

            <!-- Photo 3 -->
            <div class="photo-card animate__animated animate__zoomIn">
                <img src="pic3.jpeg" alt="Memory 3">
            </div>

            <!-- Photo 4 -->
            <div class="photo-card animate__animated animate__zoomIn">
                <img src="pic4.jpeg" alt="Memory 4">
            </div>

            <!-- Photo 5 -->
            <div class="photo-card animate__animated animate__zoomIn">
                <img src="pic5.jpeg" alt="Memory 5">
            </div>

            <!-- Photo 6 -->
            <div class="photo-card animate__animated animate__zoomIn">
                <img src="pic6.jpeg" alt="Memory 6">
            </div>

        </div>
    </div>

    <div class="footer">
        Forever & Always ✨
    </div>

</body>
</html>
